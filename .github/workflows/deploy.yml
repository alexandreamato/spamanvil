name: Deploy to WordPress.org

# Publishes to the WordPress.org SVN repo when a version tag is pushed, e.g.:
#   git tag 1.2.9 && git push origin 1.2.9
#
# One-time setup: add two repository secrets under
# Settings → Secrets and variables → Actions:
#   WPORG_SVN_USERNAME  — your WordPress.org username
#   WPORG_SVN_PASSWORD  — your WordPress.org account password (or SVN password)

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # Gate: the tag must match the version in all 4 places + have a changelog entry.
      - name: Verify version consistency
        run: php bin/check-version.php "${{ github.ref_name }}"

      - name: WordPress.org deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          SLUG: spamanvil
          # The shippable plugin lives in the spamanvil/ subfolder of the repo.
          BUILD_DIR: ${{ github.workspace }}/spamanvil

      - name: Upload plugin zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: spamanvil-${{ github.ref_name }}
          path: ${{ github.workspace }}/spamanvil.zip
          if-no-files-found: ignore
