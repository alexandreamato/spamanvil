name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    name: Unit tests + version check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Version consistency check
        run: php bin/check-version.php

      - name: Run unit suite
        run: composer test:unit

  phpcs:
    name: Coding standards (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run phpcs
        # Advisory for now: the shipped code predates WPCS adoption. Drive to zero
        # over time with `composer lint:fix`; do not block merges on it yet.
        continue-on-error: true
        run: composer lint

  plugin-check:
    name: Plugin Check (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Plugin Check
        # The same tool WordPress.org runs against plugin updates. Advisory for
        # now so findings are visible without blocking merges; the shipped code
        # predates it (see the phpcs job). Only the spamanvil/ subfolder ships.
        continue-on-error: true
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './spamanvil'

  integration:
    name: Integration tests (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
        wp: [ 'latest' ]
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      WP_TESTS_PHPUNIT_POLYFILLS_PATH: ${{ github.workspace }}/vendor/yoast/phpunit-polyfills
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Install Subversion
        # The WordPress test-suite installer fetches core test files via svn,
        # which is not preinstalled on ubuntu-24.04 runners.
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }} true

      - name: Run integration suite
        run: composer test:integration
